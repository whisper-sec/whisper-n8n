name: dep-audit

# Continuous dependency-vulnerability audit.
# Fails the build on any HIGH or CRITICAL advisory in the dependency tree.
# Runs on every pull request and every push to the default branch, plus a
# weekly off-peak sweep so a newly-disclosed advisory is caught even when no
# new commit lands. Complements the pre-publish security review.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
